plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

group = project.mod_group_id
version = project.mod_version

base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

neoForge {
    version = project.neo_version

    runs {
        server {
            server()
            programArgument '--nogui'
        }
        client {
            client()
        }
    }

    mods {
        buildinggadgets2 {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated-client/resources'
    srcDir 'src/generated-data/resources'
    exclude '**/.cache/**'
}

dependencies {
    compileOnly files('../../pack/overrides/mods/curios-neoforge-16.0.0+26.2.jar')
    runtimeOnly files('../../pack/overrides/mods/curios-neoforge-16.0.0+26.2.jar')
}

tasks.withType(ProcessResources).configureEach {
    def replacements = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version: project.neo_version,
            neo_version_range: project.neo_version_range,
            loader_version_range: project.loader_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors,
            mod_description: project.mod_description,
    ]
    inputs.properties(replacements)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replacements
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
